<html lang="en">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-512.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1A6B3C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SchemeIndia AI" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>SchemeIndia AI — Government Scheme Finder for India</title>
    <meta
      name="description"
      content="SchemeIndia AI helps you find Central and State government schemes you may qualify for. Browse schemes by state and category, see eligibility hints, documents, steps, and official links."
    />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://schemeindia.in/" />
    <meta property="og:site_name" content="SchemeIndia AI" />
    <meta property="og:title" content="SchemeIndia AI — Every benefit you deserve. Finally in one place." />
    <meta
      property="og:description"
      content="Find Central and State government schemes you may qualify for. See eligibility hints, benefits, documents, steps, and official links."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://schemeindia.in/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SchemeIndia AI — Government Scheme Finder" />

      name="twitter:description"
      content="Find Central and State government schemes you may qualify for. Eligibility hints, documents, steps, and official links."
    />
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
