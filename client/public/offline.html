<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SchemeIndia AI — Offline</title>
    <style>
      :root{color:#0f172a;background:#F8FAF9;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
      .wrap{max-width:760px;margin:0 auto;padding:24px}
      .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 2px 10px rgba(15,23,42,0.06);padding:20px}
      h1{font-size:22px;font-weight:500;margin:0 0 8px}
      p{margin:0 0 10px;line-height:1.6}
      .hint{font-size:14px;color:#475569}
      .pill{display:inline-block;background:#F1F5F9;border:1px solid #e2e8f0;border-radius:999px;padding:6px 10px;font-size:12px;color:#475569}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="pill">Offline</div>
        <h1>You’re offline.</h1>
        <p>You can still open previously visited pages and view some saved information.</p>
        <p class="hint">Reconnect to load the latest schemes and official links.</p>
      </div>
    </div>
  </body>
</html>
